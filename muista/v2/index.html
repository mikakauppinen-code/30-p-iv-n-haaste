const $=id=>document.getElementById(id),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),parse=s=>new Date(s+'T12:00:00'),months=['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'],weekdays=['Ma','Ti','Ke','To','Pe','La','Su'];let shown=new Date(),view=['day','week','month','list'].includes(localStorage.getItem('muista_v2_lastview'))?localStorage.getItem('muista_v2_lastview'):'month',items=JSON.parse(localStorage.getItem('muista_v2_events')||'[]'),trash=JSON.parse(localStorage.getItem('muista_v2_trash')||'[]');

requestAnimationFrame(()=>{$('modal').scrollTop=0})
}
function selectCalendars(){
const values=window._editCalendarIds||['own'];
let html='<h2>Valitse kalenterit</h2><p class="muted">Oma kalenteri tallentaa tapahtuman Muista!-sovellukseen. Google/iPhone-valinnat ovat vasta vientikohteita, eivät automaattisesti päivitettäviä kalentereita.</p>'+
calendars.map(c=>'<label class="calChoice"><input type="checkbox" name="calChoice" value="'+esc(c.id)+'" '+(values.includes(c.id)?'checked':'')+'><span>'+esc(c.name)+'</span></label>').join('')+
'<button class="optionRow" onclick="addCalendar()">＋ Lisää kalenteri…</button>'+
'<div class="row"><button class="ghost" onclick="returnToEdit()">Peruuta</button><button onclick="confirmCalendars()">Valitse</button></div>';
let previous=$('modalBody').innerHTML;window._editFormBackup={html:previous,values:collectEditFields()};
show(html)
}
function collectEditFields(){return ['templateChoice','title','date','attendees','videoType','videoUrl','location','alert1','alert2','description','eventColor','visibility','availability','attachmentUrl','repeat','end','allDay'].reduce((acc,id)=>{let e=$(id);if(e)acc[id]=e.type==='checkbox'?e.checked:e.value;return acc}, {time: getWheelTime(),endTime:getWheelTime('end'),weekdays:Array.from(document.querySelectorAll('input[name=weekdays]:checked')).map(x=>Number(x.value)),open:$('moreSettings')?.open||false})}
function returnToEdit(){if(!window._editFormBackup)return;const data=window._editFormBackup;show(data.html);Object.entries(data.values).forEach(([id,v])=>{let e=$(id);if(e&&id!=='time'&&id!=='endTime'&&id!=='weekdays'&&id!=='open'){if(e.type==='checkbox')e.checked=v;else e.value=v}});for(let e of document.querySelectorAll('input[name=weekdays]'))e.checked=data.values.weekdays.includes(Number(e.value));$('moreSettings').open=data.values.open;pickTemplate();if(data.values.title!==undefined)$('title').value=data.values.title;initTimeWheel(data.values.time);initTimeWheel(data.values.endTime,'end');allDayChanged();repeatFields();initializeReminders()}
function confirmCalendars(){let ids=Array.from(document.querySelectorAll('input[name=calChoice]:checked')).map(e=>e.value);if(!ids.length){alert('Valitse vähintään yksi kalenteri.');return}window._editCalendarIds=ids;returnToEdit();$('calendarSummary').textContent='Kalenterit: '+ids.length+' valittu'}
function addCalendar(){let name=prompt('Uuden paikallisen kalenterin nimi');if(!name||!name.trim())return;let id='cal'+Date.now();calendars.push({id,name:name.trim(),kind:'local'});persistCalendars();let label=document.createElement('label');label.className='calChoice';let check=document.createElement('input');check.type='checkbox';check.name='calChoice';check.value=id;check.checked=true;let span=document.createElement('span');span.textContent=name.trim();label.append(check,span);const button=Array.from(document.querySelectorAll('#modalBody button')).find(b=>b.textContent.includes('Lisää kalenteri'));if(button)button.parentElement.insertBefore(label,button);else $('modalBody').append(label)}
function openLocationPreview(){let value=$('location')?.value.trim();if(!value){alert('Kirjoita ensin osoite tai paikan nimi');return}window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(value),'_blank','noopener')}
function store(id){
let title=($('templateChoice').value==='__own'?$('title').value:$('templateChoice').value).trim(),date=$('date').value;
if(!title){alert('Kirjoita tapahtuman nimi');return}
if(!date){alert('Valitse päivämäärä');return}
let allDay=$('allDay').checked,time=allDay?'00:00':getWheelTime(),endTime=allDay?'23:59':getWheelTime('end');
if(!allDay&&endTime<=time){alert('Loppuajan pitää olla alkuaikaa myöhemmin.');return}
let existing=items.find(x=>x.id===id);
let e={...(existing||{}),id,title,date,time,endTime,allDay,
repeat:$('repeat').value,end:$('repeat').value?$('end').value:'',
weekdays:Array.from(document.querySelectorAll('input[name=weekdays]:checked')).map(x=>Number(x.value)),
calendars:(window._editCalendarIds||['own']).slice(),attendees:$('attendees').value.trim(),
videoType:$('videoType').value,videoUrl:$('videoUrl').value.trim(),location:$('location').value.trim(),description:$('description').value.trim(),color:$('eventColor').value,visibility:$('visibility').value,availability:$('availability').value,attachmentUrl:$('attachmentUrl').value.trim(),alert1:$('alert1').value,alert2:$('alert2').value};
if(e.repeat==='weekdays'&&!e.weekdays.length){alert('Valitse vähintään yksi viikonpäivä');return}
if(e.end&&e.end<date){alert('Toiston päättymispäivä ei voi olla alkupäivää aiemmin.');return}
for(let url of [e.videoUrl,e.attachmentUrl])if(url){try{let u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error('Bad protocol')}catch{alert('Linkin tulee alkaa https:// tai http://');return}}
items=items.filter(x=>x.id!==id);items.push(e);shown=parse(e.date);dismissModal();save()
}

function openEventLocation(id){let x=items.find(a=>a.id===id);if(x?.location)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.location),'_blank','noopener')}
function openEventMeeting(id){let x=items.find(a=>a.id===id);if(x?.videoUrl){try{let u=new URL(x.videoUrl);if(u.protocol==='https:'||u.protocol==='http:')window.open(u.href,'_blank','noopener')}catch{alert('Videolinkki ei ole kelvollinen')}}}
function invitationDraft(id){let x=items.find(a=>a.id===id);if(!x)return;let addresses=(x.attendees||'').split(/[,;\s]+/).filter(v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v));if(!addresses.length){alert('Lisää ensin osallistujan sähköpostiosoite tapahtumaan.');return}let body='Kutsu: '+x.title+'\nPäivä: '+x.date+'\nAika: '+(x.allDay?'Koko päivä':x.time+'–'+(x.endTime||x.time))+'\nPaikka: '+(x.location||'-')+'\nVideokokous: '+(x.videoUrl||'-')+'\n\nHuom. Vahvista tapahtuma vastaanottajan kalenterissa erikseen.';window.location.href='mailto:'+addresses.join(',')+'?subject='+encodeURIComponent('Kalenterikutsu: '+x.title)+'&body='+encodeURIComponent(body)}
function exportCalendar(id){let e=items.find(a=>a.id===id);if(!e)return;let safe=v=>String(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let ds=e.date.replace(/-/g,'');let stamp=t=>ds+'T'+String(t||'00:00').replace(':','')+'00';let plusOne=()=>{let d=parse(e.date);d.setDate(d.getDate()+1);return fmt(d).replace(/-/g,'')};let start=e.allDay?ds:stamp(e.time),end=e.allDay?plusOne():stamp(e.endTime||nextTime(e.time));let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Muista//Calendar Test//FI','BEGIN:VEVENT','UID:'+e.id+'@muista.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'') ,(e.allDay?'DTSTART;VALUE=DATE:':'DTSTART:')+start,(e.allDay?'DTEND;VALUE=DATE:':'DTEND:')+end,'SUMMARY:'+safe(e.title),'DESCRIPTION:'+safe((e.description||'')+(e.videoUrl?'\n'+e.videoUrl:'')),'LOCATION:'+safe(e.location),'END:VEVENT','END:VCALENDAR'].join('\r\n');let blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='muista-tapahtuma.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function openAttachment(id){let e=items.find(x=>x.id===id);if(e?.attachmentUrl)window.open(e.attachmentUrl,'_blank','noopener')}
function details(id,day){if(!items.some(x=>x.id===id))return;edit(id)}
function remove(id,day){let x=items.find(z=>z.id===id);show('<h2>Poista tapahtuma?</h2><p>'+esc(x.title)+'</p><p class="muted">Valitse turvallinen poistotapa.</p><div class="row"><button class="ghost" onclick="dismissModal()">Peruuta</button></div>'+(x.repeat?'<button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'once\',\''+day+'\')">Vain tämä kerta</button><button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'future\',\''+day+'\')">Tämä ja tulevat</button>':'')+'<button class="red" style="width:100%" onclick="del(\''+id+'\',\'all\',\''+day+'\')">Koko tapahtuma roskakoriin</button>')}
function del(id,kind,day){let x=items.find(z=>z.id===id);if(kind==='once'){x.excluded=[...(x.excluded||[]),day]}else if(kind==='future'){x.cutoff=day}else{trash.push({...x,deletedAt:Date.now()});items=items.filter(z=>z.id!==id)}dismissModal();save()}
function settings(){show('<h2>Asetukset</h2><button class="ghost" style="width:100%" onclick="installHelp()">📱 Lisää Muista! iPhonen Koti-valikkoon</button><h3>Roskakori</h3>'+(trash.map(x=>'<div class="bar"><span>'+esc(x.title)+'</span><button style="flex:0" onclick="restore(&quot;'+x.id+'&quot;);settings()">Palauta</button></div>').join('')||'<p class="muted">Roskakori on tyhjä.</p>')+'<button class="ghost" onclick="dismissModal()">Sulje</button>')}
function installHelp(){show('<h2>Muista! Koti-valikkoon</h2><p>1. Avaa Muista!-testisivu iPhonen Safarissa (ei ChatGPT:n sisäisessä selaimessa).</p><p>2. Napauta Safarin Jaa-kuvaketta.</p><p>3. Valitse Lisää Koti-valikkoon ja vahvista Lisää.</p><p class="muted">Tämä lisää suoran kuvakkeen testisovellukseen, ei vielä natiivia iPhone-sovellusta.</p><button class="ghost" onclick="settings()">Takaisin</button>')}
function restore(id){items.push(trash.find(x=>x.id===id));trash=trash.filter(x=>x.id!==id);save()}
render();
</script></body></html>
