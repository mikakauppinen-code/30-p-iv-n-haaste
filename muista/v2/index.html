<script>
const $=id=>document.getElementById(id),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),parse=s=>new Date(s+'T12:00:00'),months=['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'],weekdays=['Ma','Ti','Ke','To','Pe','La','Su'];let shown=new Date(),view='month',items=JSON.parse(localStorage.getItem('muista_v2_events')||'[]'),trash=JSON.parse(localStorage.getItem('muista_v2_trash')||'[]');
function save(){localStorage.setItem('muista_v2_events',JSON.stringify(items));localStorage.setItem('muista_v2_trash',JSON.stringify(trash));render()}
let templates=JSON.parse(localStorage.getItem('muista_v2_templates')||'null')||['Lääkkeet','Juo vettä','Syntymäpäivä','Nimipäivä','Koulu','Oppitunti','Palaveri','Lääkäriaika','Hammaslääkäri','Kuntosali'];
function saveTemplates(){localStorage.setItem('muista_v2_templates',JSON.stringify(templates))}
function pickTemplate(){let v=$('templateChoice').value,own=$('ownTitleBox');own.style.display=v==='__own'?'block':'none';$('title').value=v==='__own'?'':v}
function addTemplate(){let n=$('title').value.trim();if(!n){alert('Kirjoita ensin tapahtuman nimi');return}if(!templates.includes(n)){templates.push(n);saveTemplates()}let sel=$('templateChoice');sel.innerHTML=templateOptions(n);sel.value=n;pickTemplate()}
const eventStyles={'Lääkkeet':['💊','#20784e'],'Juo vettä':['💧','#087e8b'],'Syntymäpäivä':['🎂','#99449a'],'Nimipäivä':['🎉','#9b762a'],'Koulu':['🏫','#2a69ad'],'Oppitunti':['📚','#6853a9'],'Palaveri':['📅','#3e698d'],'Lääkäriaika':['🩺','#2473aa'],'Hammaslääkäri':['🦷','#328e85'],'Kuntosali':['🏋️','#6749a1'],'Työ':['💼','#355a88'],'Huolto':['🚗','#a4662b'],'Verikokeet':['🧪','#227c91']};
function eventLook(title){let k=Object.keys(eventStyles).find(x=>String(title||'').toLocaleLowerCase('fi-FI').startsWith(x.toLocaleLowerCase('fi-FI')));return eventStyles[k]||['📌','#465e84']}

function templateOptions(active){let ordered=[...new Set(['Lääkäriaika',...templates])];return ordered.map(t=>'<option value="'+esc(t)+'" '+(active===t?'selected':'')+'>'+eventEmoji(t)+' '+(t==='Lääkäriaika'?'Lääkäri':esc(t))+'</option>').join('')+'<option value="__own" '+(!templates.includes(active)?'selected':'')+'>✏️ Kirjoita itse…</option>'}

function wheelHtml(id,values){return '<div id="'+id+'" class="partWheel" role="listbox" aria-label="'+(id==='hourWheel'?'Tunnit':'Minuutit')+'" onscroll="wheelHighlight(this)">'+values.map(v=>'<div class="partWheelItem" role="option" data-num="'+v+'" onclick="this.parentElement.scrollTo({top:this.offsetTop-this.parentElement.firstElementChild.offsetTop,behavior:&#39;smooth&#39;})">'+String(v).padStart(2,'0')+'</div>').join('')+'</div>'}
function wheelHighlight(w){let i=Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/36)));Array.from(w.children).forEach((c,k)=>{c.classList.toggle('wheelActive',k===i);c.setAttribute('aria-selected',k===i?'true':'false')})}
function initTimeWheel(t){let [h,m]=(t||'12:00').split(':').map(Number);for(let [id,i] of [['hourWheel',h],['minuteWheel',m]]){let el=$(id);el.scrollTop=Math.max(0,i)*36;wheelHighlight(el)}requestAnimationFrame(()=>{for(let [id,i] of [['hourWheel',h],['minuteWheel',m]]){let el=$(id);if(el){el.scrollTop=Math.max(0,i)*36;wheelHighlight(el)}}})}
function getWheelTime(){return ['hourWheel','minuteWheel'].map(id=>{let el=$(id);return String(Math.min(el.children.length-1,Math.max(0,Math.round(el.scrollTop/36)))).padStart(2,'0')}).join(':')}
function repeatFields(){let repeat=$('repeat').value;$('weekdayArea').style.display=repeat==='weekdays'?'block':'none';$('repeatEndArea').style.display=repeat?'block':'none'}
function occurrences(d){d=parse(fmt(d));return items.filter(x=>{if(!x.date||d<parse(x.date))return false;if(x.end&&d>parse(x.end))return false;let delta=Math.round((d-parse(x.date))/86400000),a=parse(x.date),same=x.date===fmt(d);if(!x.repeat)return same;let occurs=x.repeat==='weekdays'&&(x.weekdays||[]).includes(d.getDay())||x.repeat==='day'||(x.repeat==='week'&&delta%7===0)||(x.repeat==='month'&&d.getDate()===a.getDate())||(x.repeat==='year'&&d.getDate()===a.getDate()&&d.getMonth()===a.getMonth());return occurs&&!((x.excluded||[]).includes(fmt(d)))&&(!x.cutoff||d<parse(x.cutoff))}).sort((a,b)=>a.time.localeCompare(b.time))}
function shift(k){if(view==='month')shown=new Date(shown.getFullYear(),shown.getMonth()+k,Math.min(shown.getDate(),28));else shown=new Date(shown.getFullYear(),shown.getMonth(),shown.getDate()+(view==='week'?k*7:k));render()}

let gestureStart=null;function swipeStart(e){if(view!=="day"||e.touches.length!==1)return;gestureStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}function swipeEnd(e){if(!gestureStart||view!=="day")return;let dx=e.changedTouches[0].clientX-gestureStart.x,dy=e.changedTouches[0].clientY-gestureStart.y;gestureStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)shift(dx<0?1:-1)}
function render(){let y=shown.getFullYear(),m=shown.getMonth();$('heading').textContent=months[m][0].toUpperCase()+months[m].slice(1)+' '+y;$('viewSelect').value=view;let out='';if(view==='day'){out='<h3>'+shown.toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'})+'</h3><div class="timelineHead" style="grid-template-columns:56px 1fr"><span></span><b>Tapahtumat</b></div><div class="timelineScroll" id="timelineScroll"><div class="timelineGrid" style="grid-template-columns:56px 1fr"><div class="timeAxis">'+Array.from({length:24},(_,h)=>'<div class="timeTick">'+String(h).padStart(2,'0')+':00</div>').join('')+'</div><div class="timelineDay" data-day="'+fmt(shown)+'" onclick="addAtWeek(event,this)">'+occurrences(shown).map(e=>{let p=(e.time||'12:00').split(':').map(Number),top=Math.round(((p[0]||0)*60+(p[1]||0))*58/60);return '<button class="timelineEvent" style="background:'+eventColor(e.title)+';top:'+top+'px;height:42px;left:5px;right:5px;font-size:13px" onclick="event.stopPropagation();details(&quot;'+e.id+'&quot;,&quot;'+fmt(shown)+'&quot;)"><time style="font-size:12px">'+e.time+'</time>'+eventEmoji(e.title)+' '+esc(e.title)+'</button>'}).join('')+'</div></div></div>'}else if(view==='list'){let today=fmt(shown),entries=occurrences(shown);out='<h3>'+shown.toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'})+'</h3><div class="listItems">'+(entries.length?entries.map(e=>'<button class="listEntry" style="border-left:5px solid '+eventColor(e.title)+'" onclick="details(&quot;'+e.id+'&quot;,&quot;'+today+'&quot;)"><time>'+esc(e.time||'12:00')+'</time><span>'+eventEmoji(e.title)+' '+esc(e.title)+'</span><b>›</b></button>').join(''):'<p class="muted">Ei tapahtumia. Lisää uusi painikkeesta + Lisää.</p>')+'</div>'}else if(view==='week'){let a=new Date(y,m,shown.getDate()-(shown.getDay()+6)%7);let dates=Array.from({length:7},(_,i)=>new Date(a.getFullYear(),a.getMonth(),a.getDate()+i));out='<div class="timelineHead"><span></span>'+dates.map((d,i)=>'<b><span>'+weekdays[i]+'</span><span>'+d.getDate()+'</span></b>').join('')+'</div><div class="timelineScroll" id="timelineScroll"><div class="timelineGrid"><div class="timeAxis">'+Array.from({length:24},(_,h)=>'<div class="timeTick">'+String(h).padStart(2,'0')+':00</div>').join('')+'</div>'+dates.map(d=>{let sameHour={};return '<div class="timelineDay" data-day="'+fmt(d)+'" onclick="addAtWeek(event,this)">'+occurrences(d).map(e=>{let parts=(e.time||'12:00').split(':').map(Number);let hh=Math.max(0,Math.min(23,parts[0]||0)),mm=Math.max(0,Math.min(59,parts[1]||0));let slot=hh*60+mm;let overlap=sameHour[slot]||0;sameHour[slot]=overlap+1;let top=Math.round(slot*58/60)+overlap*38;return '<button class="timelineEvent" style="background:'+eventColor(e.title)+';top:'+top+'px;height:36px" onclick="event.stopPropagation();details(&quot;'+e.id+'&quot;,&quot;'+fmt(d)+'&quot;)"><time>'+e.time+'</time>'+eventEmoji(e.title)+' '+esc(e.title)+'</button>'}).join('')+'</div>'}).join('')+'</div></div>'}else{let first=new Date(y,m,1),offset=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();out='<div class="calendar">'+weekdays.map(v=>'<b style="text-align:center;font-size:12px">'+v+'</b>').join('')+Array.from({length:Math.ceil((offset+n)/7)*7},(_,i)=>{let d=new Date(y,m,1-offset+i);return '<button class="cell" onclick="shown=parse(\''+fmt(d)+'\');view=\'day\';render()">'+d.getDate()+occurrences(d).slice(0,2).map(e=>'<small style="background:'+eventColor(e.title)+';color:white;padding:2px;border-radius:4px;display:block">'+eventEmoji(e.title)+' '+esc(e.title)+'</small>').join('')+'</button>'}).join('')+'</div>'}$('content').innerHTML=out;if(view==='week'||view==='day'){let sc=$('timelineScroll');if(sc)sc.scrollTop=6*58}}

function esc(v){return String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}

function wheelSelect(el){if(!el)return;let row=36,i=Math.max(0,Math.min(el.children.length-1,Math.round(el.scrollTop/row)));for(let k=0;k<el.children.length;k++)el.children[k].classList.toggle('active',k===i);wheelChoice[el.id==='wheelMonth'?'month':'year']=Number(el.children[i].dataset.value)}
function wheelScroll(el){wheelSelect(el)}
function wheelTap(item){item.parentElement.scrollTo({top:item.offsetTop-item.parentElement.children[0].offsetTop,behavior:'smooth'})}
function jump(){let y=shown.getFullYear();wheelChoice={month:shown.getMonth(),year:y};let yr=Array.from({length:301},(_,i)=>({value:1900+i,label:String(1900+i)}));show('<div class="wheelPrompt">Valitse</div><div class="wheelLabels"><span>Kuukausi</span><span>Vuosi</span></div><div class="wheelRow">'+wheelMarkup('wheelMonth',months.map((x,i)=>({value:i,label:x[0].toUpperCase()+x.slice(1)})))+wheelMarkup('wheelYear',yr)+'</div><div class="row"><button class="ghost" onclick="dismissModal()">Peruuta</button><button onclick="jumpGo()">Siirry</button></div>');let mo=$('wheelMonth'),ye=$('wheelYear');mo.scrollTop=shown.getMonth()*36;ye.scrollTop=(y-1900)*36;wheelSelect(mo);wheelSelect(ye)}
function jumpGo(){let mo=$('wheelMonth'),ye=$('wheelYear');if(!mo||!ye)return;wheelSelect(mo);wheelSelect(ye);shown=new Date(wheelChoice.year,wheelChoice.month,1,12);dismissModal();render()}
function addAtWeek(ev,col){if(ev.target.closest('.timelineEvent'))return;let rect=col.getBoundingClientRect();let px=ev.clientY-rect.top;let minutes=Math.max(0,Math.min(1439,Math.round(px/58*60/15)*15));let h=String(Math.floor(minutes/60)).padStart(2,'0'),m=String(minutes%60).padStart(2,'0');edit(undefined,col.dataset.day,h+':'+m)}
function edit(id,selectedDate,selectedTime){let x=items.find(a=>a.id===id)||{id:'e'+Date.now(),title:'',date:selectedDate||fmt(shown),time:selectedTime||'12:00',repeat:'',end:'',weekdays:[]};
show('<h2>'+(id?'Muokkaa':'Lisää tapahtuma')+'</h2><label>Tehtävä</label><select id="templateChoice" onchange="pickTemplate()">'+templateOptions(x.title||'Lääkäriaika')+'</select><div id="ownTitleBox" style="display:none"><input id="title" value="'+esc(x.title)+'" placeholder="Kirjoita tehtävän nimi"><button class="ghost" onclick="addTemplate()">+ Tallenna valintoihin</button><button class="ghost" onclick="templateManage()">Muokkaa valintoja</button></div><label>Päivä</label><input id="date" type="date" value="'+x.date+'"><label>Kellonaika – vieritä tuntia ja minuuttia</label><div class="wheelCols"><div><span>Tunti</span>'+wheelHtml('hourWheel',Array.from({length:24},(_,i)=>i))+'</div><div><span>Minuutti</span>'+wheelHtml('minuteWheel',Array.from({length:60},(_,i)=>i))+'</div></div><label>Toisto</label><select id="repeat" onchange="repeatFields()">'+[['','Ei toistu'],['day','Päivittäin'],['weekdays','Valitut viikonpäivät'],['week','Viikoittain'],['month','Kuukausittain'],['year','Vuosittain']].map(([v,l])=>'<option value="'+v+'" '+(v===x.repeat?'selected':'')+'>'+l+'</option>').join('')+'</select><div id="weekdayArea" style="display:none"><label>Toistuvat viikonpäivät</label><div class="weekdayChecks">'+['Su','Ma','Ti','Ke','To','Pe','La'].map((w,i)=>'<label><input type="checkbox" name="weekdays" value="'+i+'" '+((x.weekdays||[]).includes(i)?'checked':'')+'>'+w+'</label>').join('')+'</div></div><div id="repeatEndArea"><label>Toiston päättymispäivä (tyhjä = toistaiseksi)</label><input id="end" type="date" value="'+(x.end||'')+'"></div><div class="row"><button class="ghost" onclick="dismissModal()">Peruuta</button><button onclick="store(\''+x.id+'\')">Tallenna</button></div>');
initTimeWheel(x.time);repeatFields();if(!x.title)$('templateChoice').value=templates.includes('Lääkäriaika')?'Lääkäriaika':templates[0]||'__own';pickTemplate();$('modal').scrollTop=0;requestAnimationFrame(()=>{$('modal').scrollTop=0})}
function store(id){let title=($('templateChoice').value==='__own'?$('title').value:$('templateChoice').value).trim(),date=$('date').value;if(!title){alert('Kirjoita tapahtuman nimi');return}if(!date){alert('Valitse päivämäärä');return}let existing=items.find(x=>x.id===id);let e={...(existing||{}),id,title,date,time:getWheelTime(),repeat:$('repeat').value,end:$('repeat').value?$('end').value:'',weekdays:Array.from(document.querySelectorAll('input[name=weekdays]:checked')).map(x=>Number(x.value))};if(e.repeat==='weekdays'&&!e.weekdays.length){alert('Valitse vähintään yksi viikonpäivä');return}items=items.filter(x=>x.id!==id);items.push(e);shown=parse(e.date);dismissModal();save()}
function details(id,day){let x=items.find(a=>a.id===id);if(!x)return;show('<h2>'+esc(x.title)+'</h2><p>'+day+' klo '+x.time+'</p><p class="muted">Toisto: '+({day:'päivittäin',week:'viikoittain',month:'kuukausittain',year:'vuosittain'}[x.repeat]||'ei toistu')+'</p><div class="row"><button class="ghost" onclick="dismissModal()">Sulje</button><button onclick="edit(\''+id+'\')">Muokkaa</button><button class="red" onclick="remove(\''+id+'\',\''+day+'\')">Poista</button></div>')}
function remove(id,day){let x=items.find(z=>z.id===id);show('<h2>Poista tapahtuma?</h2><p>'+esc(x.title)+'</p><p class="muted">Valitse turvallinen poistotapa.</p><div class="row"><button class="ghost" onclick="dismissModal()">Peruuta</button></div>'+(x.repeat?'<button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'once\',\''+day+'\')">Vain tämä kerta</button><button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'future\',\''+day+'\')">Tämä ja tulevat</button>':'')+'<button class="red" style="width:100%" onclick="del(\''+id+'\',\'all\',\''+day+'\')">Koko tapahtuma roskakoriin</button>')}
function del(id,kind,day){let x=items.find(z=>z.id===id);if(kind==='once'){x.excluded=[...(x.excluded||[]),day]}else if(kind==='future'){x.cutoff=day}else{trash.push({...x,deletedAt:Date.now()});items=items.filter(z=>z.id!==id)}dismissModal();save()}
function settings(){show('<h2>Asetukset</h2><h3>Roskakori</h3>'+(trash.map(x=>'<div class="bar"><span>'+esc(x.title)+'</span><button style="flex:0" onclick="restore(&quot;'+x.id+'&quot;);settings()">Palauta</button></div>').join('')||'<p class="muted">Roskakori on tyhjä.</p>')+'<button class="ghost" onclick="dismissModal()">Sulje</button>')}
function restore(id){items.push(trash.find(x=>x.id===id));trash=trash.filter(x=>x.id!==id);save()}
render();
</script></body></html>
