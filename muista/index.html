<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Muista! – testi</title><style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f0f5ff;color-scheme:dark}*{box-sizing:border-box}body{max-width:800px;margin:auto;padding:18px 12px 65px}button,input,select,textarea{font:inherit}button{background:#367ef3;border:0;border-radius:10px;color:white;padding:10px;cursor:pointer}button:active{opacity:.75}.muted{color:#aebdd1;font-size:13px}.bar{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:16px 0}.bar button{flex:1}.card{background:#1d2b3d;border:1px solid #354860;border-radius:14px;padding:13px;margin:10px 0}.tabs{display:flex;gap:6px}.tabs button{flex:1}.selected{background:#eff6ff;color:#12233c}input,select,textarea{width:100%;border:1px solid #4a607b;border-radius:9px;background:#111f30;color:white;padding:10px;margin:5px 0 10px}.hidden{display:none}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.week>div{background:#263449;border-radius:5px;padding:4px 2px;min-height:130px;overflow:hidden}.mini{font-size:10px;overflow-wrap:anywhere;background:#346caa;border-radius:4px;padding:3px;margin:4px 0}.day{display:flex;align-items:center;gap:8px}.day b{min-width:52px;white-space:nowrap}.event{padding:10px;background:#28456b;border-radius:8px;flex:1;overflow-wrap:anywhere}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.cell{background:#243349;min-height:60px;border:0;padding:5px 2px;font-size:12px;border-radius:4px}.cell small{display:block;font-size:9px;overflow-wrap:anywhere}.modal{position:fixed;inset:0;background:#000c;z-index:4;overflow:auto;padding:15px}.modal>.card{max-width:580px;margin:20px auto;padding:18px}.primary{background:#367ef3}.red{background:#ac4053}.ghost{background:#34465e}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;font-size:14px;margin-top:8px}.foot{margin-top:20px;background:#343040;border-left:3px solid orange;padding:12px;border-radius:8px;font-size:12px;color:#d5dce8}
</style></head><body>
<header class="bar"><div><h1>🔔 Muista!</h1><div class="muted">Osa 5 · selainkokeilu</div></div><button style="flex:0" onclick="edit()">+ Lisää</button></header>
<div class="tabs"><button onclick="view='day';render()" id="daybtn">Päivä</button><button onclick="view='week';render()" id="weekbtn">Viikko</button><button onclick="view='month';render()" id="monthbtn">Kuukausi</button></div>
<div class="bar"><button class="ghost" onclick="shift(-1)">❮</button><button class="ghost" style="flex:3" onclick="jump()"><span id="heading"></span> ⌄</button><button class="ghost" onclick="shift(1)">❯</button></div>
<button class="ghost" onclick="shown=new Date();render()">Tänään</button><div id="content" class="card"></div>
<div class="card"><h3>Roskakori</h3><div id="trash"></div></div>
<div class="foot">Kokeilu tallentaa tiedot vain tämän selaimen paikalliseen muistiin. Ei iCloudia eikä oikeita äänihälytyksiä. Älä tallenna tähän tärkeitä menoja.</div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>
<script>
const $=id=>document.getElementById(id),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),parse=s=>new Date(s+'T12:00:00'),months=['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'],weekdays=['Ma','Ti','Ke','To','Pe','La','Su'];let shown=new Date(),view='month',items=JSON.parse(localStorage.getItem('muista_trial_events')||'[]'),trash=JSON.parse(localStorage.getItem('muista_trial_trash')||'[]');
function save(){localStorage.setItem('muista_trial_events',JSON.stringify(items));localStorage.setItem('muista_trial_trash',JSON.stringify(trash));render()}
function occurrences(d){return items.filter(x=>{if(d<parse(x.date))return false;if(x.end&&d>parse(x.end))return false;let delta=Math.round((d-parse(x.date))/86400000),a=parse(x.date),same=x.date===fmt(d);if(!x.repeat)return same;let occurs=x.repeat==='day'||(x.repeat==='week'&&delta%7===0)||(x.repeat==='month'&&d.getDate()===a.getDate())||(x.repeat==='year'&&d.getDate()===a.getDate()&&d.getMonth()===a.getMonth());return occurs&&!((x.excluded||[]).includes(fmt(d)))&&(!x.cutoff||d<parse(x.cutoff))}).sort((a,b)=>a.time.localeCompare(b.time))}
function shift(k){if(view==='month')shown=new Date(shown.getFullYear(),shown.getMonth()+k,Math.min(shown.getDate(),28));else shown=new Date(shown.getFullYear(),shown.getMonth(),shown.getDate()+(view==='week'?k*7:k));render()}
function render(){let y=shown.getFullYear(),m=shown.getMonth();$('heading').textContent=months[m][0].toUpperCase()+months[m].slice(1)+' '+y;['day','week','month'].forEach(v=>$(v+'btn').className=view===v?'selected':'');let out='';if(view==='day'){out='<h3>'+shown.toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'})+'</h3>';out+=occurrences(shown).map(e=>'<div class="day" onclick="details(\''+e.id+'\',\''+fmt(shown)+'\')"><b>'+e.time+'</b><div class="event">'+esc(e.title)+'</div></div>').join('')||'<p class="muted">Ei tapahtumia.</p>'}else if(view==='week'){let a=new Date(y,m,shown.getDate()-(shown.getDay()+6)%7);out='<div class="week">'+Array.from({length:7},(_,i)=>{let d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);return '<div onclick="shown=parse(\''+fmt(d)+'\');view=\'day\';render()"><b style="font-size:11px">'+weekdays[i]+' '+d.getDate()+'</b>'+occurrences(d).map(e=>'<div class="mini">'+e.time+' '+esc(e.title)+'</div>').join('')+'</div>'}).join('')+'</div>'}else{let first=new Date(y,m,1),offset=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();out='<div class="calendar">'+weekdays.map(v=>'<b style="text-align:center;font-size:12px">'+v+'</b>').join('')+Array.from({length:Math.ceil((offset+n)/7)*7},(_,i)=>{let d=new Date(y,m,1-offset+i);return '<button class="cell" onclick="shown=parse(\''+fmt(d)+'\');view=\'day\';render()">'+d.getDate()+occurrences(d).slice(0,2).map(e=>'<small>• '+esc(e.title)+'</small>').join('')+'</button>'}).join('')+'</div>'}$('content').innerHTML=out;$('trash').innerHTML=trash.map(x=>'<div class="bar"><span>'+esc(x.title)+'</span><button style="flex:0" onclick="restore(\''+x.id+'\')">Palauta</button></div>').join('')||'<span class="muted">Tyhjä</span>'}
function esc(v){return String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}
function close(){$('modal').classList.add('hidden')}
function show(s){$('modalBody').innerHTML=s;$('modal').classList.remove('hidden')}
function jump(){show('<h2>Siirry kuukauteen ja vuoteen</h2><label>Kuukausi</label><select id="jumpmonth">'+months.map((x,i)=>'<option value="'+i+'" '+(i===shown.getMonth()?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Vuosi</label><input id="jumpyear" type="number" value="'+shown.getFullYear()+'"><div class="row"><button class="ghost" onclick="close()">Peruuta</button><button onclick="shown=new Date(Number($(\'jumpyear\').value),Number($(\'jumpmonth\').value),1);close();render()">Siirry</button></div>')}
function edit(id){let x=items.find(a=>a.id===id)||{id:'e'+Date.now(),title:'',date:fmt(shown),time:'12:00',repeat:'',end:''};show('<h2>'+(id?'Muokkaa':'Lisää tapahtuma')+'</h2><label>Tapahtuma</label><input id="title" value="'+esc(x.title)+'" placeholder="Esim. lääkkeet"><label>Päivä</label><input id="date" type="date" value="'+x.date+'"><label>Kellonaika</label><input id="time" type="time" value="'+x.time+'"><label>Toisto</label><select id="repeat">'+[['','Ei toistu'],['day','Päivittäin'],['week','Viikoittain'],['month','Kuukausittain'],['year','Vuosittain']].map(([v,l])=>'<option value="'+v+'" '+(v===x.repeat?'selected':'')+'>'+l+'</option>').join('')+'</select><label>Toiston päättymispäivä (tyhjä = toistaiseksi)</label><input id="end" type="date" value="'+(x.end||'')+'"><div class="row"><button class="ghost" onclick="close()">Peruuta</button><button onclick="store(\''+x.id+'\')">Tallenna</button></div>')}
function store(id){let title=$('title').value.trim();if(!title){alert('Kirjoita tapahtuman nimi');return}let existing=items.find(x=>x.id===id);let e={...(existing||{}),id,title,date:$('date').value,time:$('time').value,repeat:$('repeat').value,end:$('end').value};items=items.filter(x=>x.id!==id);items.push(e);close();save()}
function details(id,day){let x=items.find(a=>a.id===id);if(!x)return;show('<h2>'+esc(x.title)+'</h2><p>'+day+' klo '+x.time+'</p><p class="muted">Toisto: '+({day:'päivittäin',week:'viikoittain',month:'kuukausittain',year:'vuosittain'}[x.repeat]||'ei toistu')+'</p><div class="row"><button class="ghost" onclick="close()">Sulje</button><button onclick="edit(\''+id+'\')">Muokkaa</button><button class="red" onclick="remove(\''+id+'\',\''+day+'\')">Poista</button></div>')}
function remove(id,day){let x=items.find(z=>z.id===id);show('<h2>Poista tapahtuma?</h2><p>'+esc(x.title)+'</p><p class="muted">Valitse turvallinen poistotapa.</p><div class="row"><button class="ghost" onclick="close()">Peruuta</button></div>'+(x.repeat?'<button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'once\',\''+day+'\')">Vain tämä kerta</button><button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'future\',\''+day+'\')">Tämä ja tulevat</button>':'')+'<button class="red" style="width:100%" onclick="del(\''+id+'\',\'all\',\''+day+'\')">Koko tapahtuma roskakoriin</button>')}
function del(id,kind,day){let x=items.find(z=>z.id===id);if(kind==='once'){x.excluded=[...(x.excluded||[]),day]}else if(kind==='future'){x.cutoff=day}else{trash.push({...x,deletedAt:Date.now()});items=items.filter(z=>z.id!==id)}close();save()}
function restore(id){items.push(trash.find(x=>x.id===id));trash=trash.filter(x=>x.id!==id);save()}
render();
</script></body></html>
