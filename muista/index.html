<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Muista! – testi</title><style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#101827;color:#f0f5ff;color-scheme:dark}*{box-sizing:border-box}body{max-width:800px;margin:auto;padding:18px 12px 65px}button,input,select,textarea{font:inherit}button{background:#367ef3;border:0;border-radius:10px;color:white;padding:10px;cursor:pointer}button:active{opacity:.75}.muted{color:#aebdd1;font-size:13px}.bar{display:flex;gap:7px;align-items:center;justify-content:space-between;margin:16px 0}.bar button{flex:1}.card{background:#1d2b3d;border:1px solid #354860;border-radius:14px;padding:13px;margin:10px 0}.tabs{display:flex;gap:6px}.tabs button{flex:1}.selected{background:#eff6ff;color:#12233c}input,select,textarea{width:100%;border:1px solid #4a607b;border-radius:9px;background:#111f30;color:white;padding:10px;margin:5px 0 10px}.hidden{display:none}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.week>div{background:#263449;border-radius:5px;padding:3px 1px;min-height:150px;overflow:visible;min-width:0}.mini{font-size:8px;line-height:1.12;overflow-wrap:anywhere;background:#346caa;border-radius:4px;padding:2px 1px;margin:2px 0;cursor:pointer;min-width:0}.day{display:flex;align-items:center;gap:8px}.day b{min-width:52px;white-space:nowrap}.event{padding:10px;background:#28456b;border-radius:8px;flex:1;overflow-wrap:anywhere}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.cell{background:#243349;min-height:60px;border:0;padding:5px 2px;font-size:12px;border-radius:4px}.cell small{display:block;font-size:9px;overflow-wrap:anywhere}.modal{position:fixed;inset:0;background:#000c;z-index:4;overflow:auto;padding:15px}.modal>.card{max-width:580px;margin:20px auto;padding:18px}.primary{background:#367ef3}.red{background:#ac4053}.ghost{background:#34465e}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;font-size:14px;margin-top:8px}.foot{margin-top:20px;background:#343040;border-left:3px solid orange;padding:12px;border-radius:8px;font-size:12px;color:#d5dce8}
.timelineHead{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:1px;margin-top:8px;position:sticky;top:0;z-index:2;background:#1d2b3d;padding:5px 0}.timelineHead b{text-align:center;font-size:10px;white-space:normal;line-height:1.3;display:flex;flex-direction:column;align-items:center}.timelineHead b span{display:block}.timelineScroll{height:490px;overflow-y:auto;overscroll-behavior:contain;border:1px solid #34465e;border-radius:0 0 10px 10px}.timelineGrid{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));height:1392px;min-height:1392px;position:relative}.timeAxis{position:relative;background:#1d2b3d}.timeTick{height:58px;border-top:1px solid #43536a;color:#aebdd1;font-size:10px;text-align:right;padding:2px 4px 0 0;white-space:nowrap}.timelineDay{position:relative;border-left:1px solid #43536a;background:repeating-linear-gradient(to bottom,#243349 0px,#243349 57px,#43536a 57px,#43536a 58px);min-width:0}.timelineEvent{position:absolute;left:1px;right:1px;min-height:34px;background:#388dce;color:#fff;border:1px solid #66ade9;border-radius:5px;padding:2px 1px;overflow:hidden;overflow-wrap:anywhere;font-size:8px;line-height:1.15;z-index:1}.timelineEvent time{display:block;white-space:nowrap;font-size:8px;letter-spacing:-.35px;font-weight:700}.timelineEvent:focus-visible{outline:2px solid #fff}.quickActions{display:flex;justify-content:center;gap:8px;margin:5px 0 7px}.quickActions button{font-size:13px;padding:7px 15px;flex:0 0 auto;min-height:34px}.tabs button{font-size:13px;padding:8px 5px}.bar{margin:8px 0;gap:5px}.bar button{font-size:13px;padding:7px 6px;min-height:34px}header.bar{margin:3px 0 9px}header h1{font-size:23px;margin:0 0 2px}header .muted{font-size:11px}body{padding-top:10px}#content.card{padding:7px;margin-top:7px}.timelineScroll{height:min(65dvh,650px)}@media(max-width:390px){.quickActions button{padding:6px 12px}.tabs button{font-size:12px}}.appFooter{display:flex;justify-content:flex-end;margin:18px 0 5px;padding-bottom:6px}.appFooter button{font-size:13px;padding:9px 14px;min-height:38px}.viewSwitch{display:flex;align-items:center;gap:8px;margin:4px 0 6px}.viewSwitch label{font-size:12px;color:#aebdd1;margin:0}.viewSwitch select{width:auto;min-width:120px;margin:0;padding:6px 24px 6px 10px;font-size:13px;min-height:34px;background:#243954;border:1px solid #405b79;border-radius:9px}.quickActions select{width:auto;min-width:132px;margin:0;padding:6px 18px 6px 10px;background:#243954;color:#fff;border:1px solid #405b79;border-radius:9px;font-size:13px;min-height:34px}.quickActions{justify-content:flex-start;align-items:center}.yearWheel{height:175px;overflow-y:auto;text-align:center;font-size:20px;scroll-snap-type:y proximity}.yearWheel option{padding:8px;scroll-snap-align:center}.jumpTitle{font-size:21px;margin:0 0 16px}.wheelLabels{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-size:13px;color:#b8c6d9;margin-bottom:5px}.wheelRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.spinWheel{height:144px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border-radius:10px;background:linear-gradient(#152235,#263b55 35%,#263b55 65%,#152235);padding:54px 0;scrollbar-width:none;touch-action:pan-y}.spinWheel::-webkit-scrollbar{display:none}.spinItem{height:36px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;color:#9baabd;white-space:nowrap;user-select:none}.spinItem.active{color:white;font-weight:700;background:#40536c;border-radius:7px}.modal>.card{padding:16px}.wheelPrompt{font-size:13px;color:#b8c6d9;text-align:center;margin:0 0 8px;font-weight:600}</style></head><body>
<header class="bar"><div><h1>🔔 Muista!</h1><div class="muted">Osa 5 · selainkokeilu</div></div></header>
<div class="bar"><button class="ghost" onclick="shift(-1)">❮</button><button class="ghost" style="flex:3" onclick="jump()"><span id="heading"></span> ⌄</button><button class="ghost" onclick="shift(1)">❯</button></div>
<div class="quickActions"><select id="viewSelect" aria-label="Kalenterinäkymä" onchange="chooseView(this.value)"><option value="today">Tänään</option><option value="day">Päivä</option><option value="week">Viikko</option><option value="month" selected>Kuukausi</option></select><button onclick="edit()">+ Lisää</button></div><div id="content" class="card" ontouchstart="swipeStart(event)" ontouchend="swipeEnd(event)"></div>
<footer class="appFooter"><button class="ghost" onclick="settings()" aria-label="Asetukset">⚙️ Asetukset</button></footer>
<div class="foot">Kokeilu tallentaa tiedot vain tämän selaimen paikalliseen muistiin. Ei iCloudia eikä oikeita äänihälytyksiä. Älä tallenna tähän tärkeitä menoja.</div>
<div class="modal hidden" id="modal"><div class="card" id="modalBody"></div></div>
<script>
const $=id=>document.getElementById(id),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),parse=s=>new Date(s+'T12:00:00'),months=['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'],weekdays=['Ma','Ti','Ke','To','Pe','La','Su'];let shown=new Date(),view='month',items=JSON.parse(localStorage.getItem('muista_trial_events')||'[]'),trash=JSON.parse(localStorage.getItem('muista_trial_trash')||'[]');
function save(){localStorage.setItem('muista_trial_events',JSON.stringify(items));localStorage.setItem('muista_trial_trash',JSON.stringify(trash));render()}
function occurrences(d){return items.filter(x=>{if(d<parse(x.date))return false;if(x.end&&d>parse(x.end))return false;let delta=Math.round((d-parse(x.date))/86400000),a=parse(x.date),same=x.date===fmt(d);if(!x.repeat)return same;let occurs=x.repeat==='day'||(x.repeat==='week'&&delta%7===0)||(x.repeat==='month'&&d.getDate()===a.getDate())||(x.repeat==='year'&&d.getDate()===a.getDate()&&d.getMonth()===a.getMonth());return occurs&&!((x.excluded||[]).includes(fmt(d)))&&(!x.cutoff||d<parse(x.cutoff))}).sort((a,b)=>a.time.localeCompare(b.time))}
function shift(k){if(view==='month')shown=new Date(shown.getFullYear(),shown.getMonth()+k,Math.min(shown.getDate(),28));else shown=new Date(shown.getFullYear(),shown.getMonth(),shown.getDate()+(view==='week'?k*7:k));render()}
function chooseView(v){if(v==="today"){shown=new Date();view="day"}else{view=v}render()}
let gestureStart=null;function swipeStart(e){if(view!=="day"||e.touches.length!==1)return;gestureStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}function swipeEnd(e){if(!gestureStart||view!=="day")return;let dx=e.changedTouches[0].clientX-gestureStart.x,dy=e.changedTouches[0].clientY-gestureStart.y;gestureStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)shift(dx<0?1:-1)}
function render(){let y=shown.getFullYear(),m=shown.getMonth();$('heading').textContent=months[m][0].toUpperCase()+months[m].slice(1)+' '+y;$('viewSelect').value=view;let out='';if(view==='day'){out='<h3>'+shown.toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long'})+'</h3><div class="timelineHead" style="grid-template-columns:56px 1fr"><span></span><b>Tapahtumat</b></div><div class="timelineScroll" id="timelineScroll"><div class="timelineGrid" style="grid-template-columns:56px 1fr"><div class="timeAxis">'+Array.from({length:24},(_,h)=>'<div class="timeTick">'+String(h).padStart(2,'0')+':00</div>').join('')+'</div><div class="timelineDay" data-day="'+fmt(shown)+'" onclick="addAtWeek(event,this)">'+occurrences(shown).map(e=>{let p=(e.time||'12:00').split(':').map(Number),top=Math.round(((p[0]||0)*60+(p[1]||0))*58/60);return '<button class="timelineEvent" style="top:'+top+'px;height:42px;left:5px;right:5px;font-size:13px" onclick="event.stopPropagation();details(&quot;'+e.id+'&quot;,&quot;'+fmt(shown)+'&quot;)"><time style="font-size:12px">'+e.time+'</time>'+esc(e.title)+'</button>'}).join('')+'</div></div></div>'}else if(view==='week'){let a=new Date(y,m,shown.getDate()-(shown.getDay()+6)%7);let dates=Array.from({length:7},(_,i)=>new Date(a.getFullYear(),a.getMonth(),a.getDate()+i));out='<div class="timelineHead"><span></span>'+dates.map((d,i)=>'<b><span>'+weekdays[i]+'</span><span>'+d.getDate()+'</span></b>').join('')+'</div><div class="timelineScroll" id="timelineScroll"><div class="timelineGrid"><div class="timeAxis">'+Array.from({length:24},(_,h)=>'<div class="timeTick">'+String(h).padStart(2,'0')+':00</div>').join('')+'</div>'+dates.map(d=>{let sameHour={};return '<div class="timelineDay" data-day="'+fmt(d)+'" onclick="addAtWeek(event,this)">'+occurrences(d).map(e=>{let parts=(e.time||'12:00').split(':').map(Number);let hh=Math.max(0,Math.min(23,parts[0]||0)),mm=Math.max(0,Math.min(59,parts[1]||0));let slot=hh*60+mm;let overlap=sameHour[slot]||0;sameHour[slot]=overlap+1;let top=Math.round(slot*58/60)+overlap*38;return '<button class="timelineEvent" style="top:'+top+'px;height:36px" onclick="event.stopPropagation();details(&quot;'+e.id+'&quot;,&quot;'+fmt(d)+'&quot;)"><time>'+e.time+'</time>'+esc(e.title)+'</button>'}).join('')+'</div>'}).join('')+'</div></div>'}else{let first=new Date(y,m,1),offset=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();out='<div class="calendar">'+weekdays.map(v=>'<b style="text-align:center;font-size:12px">'+v+'</b>').join('')+Array.from({length:Math.ceil((offset+n)/7)*7},(_,i)=>{let d=new Date(y,m,1-offset+i);return '<button class="cell" onclick="shown=parse(\''+fmt(d)+'\');view=\'day\';render()">'+d.getDate()+occurrences(d).slice(0,2).map(e=>'<small>• '+esc(e.title)+'</small>').join('')+'</button>'}).join('')+'</div>'}$('content').innerHTML=out;if(view==='week'||view==='day'){let sc=$('timelineScroll');if(sc)sc.scrollTop=6*58}}

function esc(v){return String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}
function close(){$('modal').classList.add('hidden')}
function show(s){$('modalBody').innerHTML=s;$('modal').classList.remove('hidden')}
let wheelChoice={month:0,year:2026};
function wheelMarkup(id,values,selected){return '<div class="spinWheel" id="'+id+'" role="listbox" aria-label="'+(id==='wheelMonth'?'Kuukausi':'Vuosi')+'" onscroll="wheelScroll(this)">'+values.map((v,i)=>'<div class="spinItem" data-value="'+v.value+'" onclick="wheelTap(this)" role="option">'+v.label+'</div>').join('')+'</div>'}
function wheelSelect(el){if(!el)return;let row=36,i=Math.max(0,Math.min(el.children.length-1,Math.round(el.scrollTop/row)));for(let k=0;k<el.children.length;k++)el.children[k].classList.toggle('active',k===i);wheelChoice[el.id==='wheelMonth'?'month':'year']=Number(el.children[i].dataset.value)}
function wheelScroll(el){wheelSelect(el)}
function wheelTap(item){item.parentElement.scrollTo({top:item.offsetTop-item.parentElement.children[0].offsetTop,behavior:'smooth'})}
function jump(){let y=shown.getFullYear();wheelChoice={month:shown.getMonth(),year:y};let yr=Array.from({length:301},(_,i)=>({value:1900+i,label:String(1900+i)}));show('<div class="wheelPrompt">Valitse</div><div class="wheelLabels"><span>Kuukausi</span><span>Vuosi</span></div><div class="wheelRow">'+wheelMarkup('wheelMonth',months.map((x,i)=>({value:i,label:x[0].toUpperCase()+x.slice(1)})))+wheelMarkup('wheelYear',yr)+'</div><div class="row"><button class="ghost" onclick="close()">Peruuta</button><button onclick="jumpGo()">Siirry</button></div>');let mo=$('wheelMonth'),ye=$('wheelYear');mo.scrollTop=shown.getMonth()*36;ye.scrollTop=(y-1900)*36;wheelSelect(mo);wheelSelect(ye)}
function jumpGo(){let mo=$('wheelMonth'),ye=$('wheelYear');if(!mo||!ye)return;wheelSelect(mo);wheelSelect(ye);shown=new Date(wheelChoice.year,wheelChoice.month,1,12);close();render()}
function addAtWeek(ev,col){if(ev.target.closest('.timelineEvent'))return;let rect=col.getBoundingClientRect();let px=ev.clientY-rect.top;let minutes=Math.max(0,Math.min(1439,Math.round(px/58*60/15)*15));let h=String(Math.floor(minutes/60)).padStart(2,'0'),m=String(minutes%60).padStart(2,'0');edit(undefined,col.dataset.day,h+':'+m)}
function edit(id,selectedDate,selectedTime){let x=items.find(a=>a.id===id)||{id:'e'+Date.now(),title:'',date:selectedDate||fmt(shown),time:selectedTime||'12:00',repeat:'',end:''};show('<h2>'+(id?'Muokkaa':'Lisää tapahtuma')+'</h2><label>Tapahtuma</label><input id="title" value="'+esc(x.title)+'" placeholder="Esim. lääkkeet"><label>Päivä</label><input id="date" type="date" value="'+x.date+'"><label>Kellonaika</label><input id="time" type="time" value="'+x.time+'"><label>Toisto</label><select id="repeat">'+[['','Ei toistu'],['day','Päivittäin'],['week','Viikoittain'],['month','Kuukausittain'],['year','Vuosittain']].map(([v,l])=>'<option value="'+v+'" '+(v===x.repeat?'selected':'')+'>'+l+'</option>').join('')+'</select><label>Toiston päättymispäivä (tyhjä = toistaiseksi)</label><input id="end" type="date" value="'+(x.end||'')+'"><div class="row"><button class="ghost" onclick="close()">Peruuta</button><button onclick="store(\''+x.id+'\')">Tallenna</button></div>')}
function store(id){let title=$('title').value.trim();if(!title){alert('Kirjoita tapahtuman nimi');return}let existing=items.find(x=>x.id===id);let e={...(existing||{}),id,title,date:$('date').value,time:$('time').value,repeat:$('repeat').value,end:$('end').value};items=items.filter(x=>x.id!==id);items.push(e);close();save()}
function details(id,day){let x=items.find(a=>a.id===id);if(!x)return;show('<h2>'+esc(x.title)+'</h2><p>'+day+' klo '+x.time+'</p><p class="muted">Toisto: '+({day:'päivittäin',week:'viikoittain',month:'kuukausittain',year:'vuosittain'}[x.repeat]||'ei toistu')+'</p><div class="row"><button class="ghost" onclick="close()">Sulje</button><button onclick="edit(\''+id+'\')">Muokkaa</button><button class="red" onclick="remove(\''+id+'\',\''+day+'\')">Poista</button></div>')}
function remove(id,day){let x=items.find(z=>z.id===id);show('<h2>Poista tapahtuma?</h2><p>'+esc(x.title)+'</p><p class="muted">Valitse turvallinen poistotapa.</p><div class="row"><button class="ghost" onclick="close()">Peruuta</button></div>'+(x.repeat?'<button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'once\',\''+day+'\')">Vain tämä kerta</button><button style="width:100%;margin:5px 0" onclick="del(\''+id+'\',\'future\',\''+day+'\')">Tämä ja tulevat</button>':'')+'<button class="red" style="width:100%" onclick="del(\''+id+'\',\'all\',\''+day+'\')">Koko tapahtuma roskakoriin</button>')}
function del(id,kind,day){let x=items.find(z=>z.id===id);if(kind==='once'){x.excluded=[...(x.excluded||[]),day]}else if(kind==='future'){x.cutoff=day}else{trash.push({...x,deletedAt:Date.now()});items=items.filter(z=>z.id!==id)}close();save()}
function settings(){show('<h2>Asetukset</h2><h3>Roskakori</h3>'+(trash.map(x=>'<div class="bar"><span>'+esc(x.title)+'</span><button style="flex:0" onclick="restore(&quot;'+x.id+'&quot;);settings()">Palauta</button></div>').join('')||'<p class="muted">Roskakori on tyhjä.</p>')+'<button class="ghost" onclick="close()">Sulje</button>')}
function restore(id){items.push(trash.find(x=>x.id===id));trash=trash.filter(x=>x.id!==id);save()}
render();
</script></body></html>
